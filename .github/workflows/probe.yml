name: probe apk-tools

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: apk-tools version & mkpkg help
        run: |
          docker run --rm alpine:edge sh -c '
            apk --version
            echo "=================== apk --help ==================="
            apk --help 2>&1 | sed -n "1,70p"
            echo "=================== mkpkg --help ==================="
            apk mkpkg --help 2>&1 | sed -n "1,80p"
          '
